# Runs the digest in the cloud every morning. Off until you turn it on, so copies of this
# repo don't run by accident. To turn it on in YOUR PRIVATE copy:
#   python scripts/push_github_secrets.py
# (or add the secrets below by hand and a repository variable DIGEST_ENABLED=true).
name: eClass daily digest

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 7 AM Toronto (6 AM in winter)
  workflow_dispatch:

concurrency: eclass-digest

jobs:
  digest:
    if: vars.DIGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # "What I've already seen" lives in the Actions cache between runs.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: eclass-state-${{ github.run_id }}
          restore-keys: eclass-state-

      - run: python -m eclass_digest
        env:
          ECLASS_TOKEN: ${{ secrets.ECLASS_TOKEN }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          EMAIL_METHOD: smtp
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCAL_CALENDAR_ID: ${{ secrets.GCAL_CALENDAR_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: eclass-state-${{ github.run_id }}
