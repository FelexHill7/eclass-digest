# Runs the digest in the cloud. Off until you turn it on, so copies of this repo don't run by
# accident. To turn it on in YOUR PRIVATE copy:
#   python scripts/push_github_secrets.py
# (or add the secrets below by hand and a repository variable DIGEST_ENABLED=true).
#
# Times are Toronto daylight time (EDT, UTC-4); in winter (EST) each runs an hour earlier.
name: eClass digest

on:
  schedule:
    - cron: "30 11 * * *"      # 7:30 AM  morning "due today"
    - cron: "0 13-23/2 * * *"  # 9 AM - 7 PM every 2 hours: checks
    - cron: "0 1 * * *"        # 9 PM: last check
    - cron: "0 0 * * *"        # 8 PM: evening digest
  workflow_dispatch:
    inputs:
      mode:
        description: Which run
        type: choice
        options: [digest, check, morning]
        default: digest

concurrency: eclass-digest

jobs:
  run:
    if: vars.DIGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pick the mode
        run: |
          case "${{ github.event.schedule }}" in
            "30 11 * * *") mode=morning ;;
            "0 0 * * *")   mode=digest ;;
            "")            mode="${{ inputs.mode }}" ;;
            *)             mode=check ;;
          esac
          echo "MODE=$mode" >> "$GITHUB_ENV"

      # "What I've already seen" lives in the Actions cache between runs.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: eclass-state-${{ github.run_id }}
          restore-keys: eclass-state-

      - run: python -m eclass_digest --mode "$MODE"
        env:
          ECLASS_TOKEN: ${{ secrets.ECLASS_TOKEN }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          EMAIL_METHOD: smtp
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCAL_CALENDAR_ID: ${{ secrets.GCAL_CALENDAR_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INCLUDE_COURSES: ${{ vars.INCLUDE_COURSES }}
          EXCLUDE_COURSES: ${{ vars.EXCLUDE_COURSES }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: eclass-state-${{ github.run_id }}
